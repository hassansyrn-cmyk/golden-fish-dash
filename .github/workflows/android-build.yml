name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build a signed AAB for this selected branch
        required: true
        default: false
        type: boolean
      admob_testing:
        description: Use Google sample ads (enable for debug or closed-testing AABs)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check game source
        run: pnpm typecheck

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy 'tools' package from the SDK repository;
          # requesting it fails sdkmanager. platform-tools is still valid.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Build web application
        env:
          VITE_ADMOB_TESTING: "true"
          VITE_ADMOB_DIAGNOSTICS: "true"
        run: pnpm build

      - name: Sync with Capacitor
        run: pnpm cap:sync

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug -PdiagnosticApk=true --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: golden-fish-dash-admob-diagnostic-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release-aab:
    name: Build Signed Android App Bundle
    needs: debug-apk
    # Diagnostic branches are APK-only, including automatic push-triggered runs.
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_release == true)) && !startsWith(github.ref, 'refs/heads/diagnostic/')
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate signing secrets
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy 'tools' package from the SDK repository;
          # requesting it fails sdkmanager. platform-tools is still valid.
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36"

      - name: Build web application
        env:
          VITE_ADMOB_TESTING: ${{ github.event_name != 'workflow_dispatch' || inputs.admob_testing }}
        run: pnpm build

      - name: Verify production rewarded units
        if: github.event_name == 'workflow_dispatch' && inputs.build_release == true && inputs.admob_testing == false
        shell: bash
        run: |
          set -euo pipefail
          for id in "ca-app-pub-7778383086464835/5578402291" "ca-app-pub-7778383086464835/1234465629"; do
            if ! grep -R -Fq "$id" dist/assets; then
              echo "Production rewarded ad unit not found in bundle: $id" >&2
              exit 1
            fi
          done

      - name: Sync with Capacitor
        run: pnpm cap:sync

      - name: Decode keystore
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Build Android App Bundle
        env:
          RELEASE_STORE_FILE: release.keystore
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify signed AAB
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-fish-dash-signed-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
